name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Strumento per leggere i PDF (serve ai test della Biblioteca)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Test
        run: cd bot && python -I -m unittest discover -s tests
      - name: Controllo segreti
        run: python scripts/check_secrets.py
      - name: Controllo script
        run: bash -n setup.sh && bash -n manager
